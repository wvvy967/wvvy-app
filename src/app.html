<!doctype html>
<html lang="en" style="background-color: #0a0908">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%sveltekit.assets%/icon.svg" />
    <link rel="apple-touch-icon" href="%sveltekit.assets%/apple-touch-icon.png" />
    <!-- viewport-fit=cover lets the layout run under the notch; the safe-area
         padding in app.css keeps content clear of it. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#0a0908" />
    <!-- Apply the saved (or OS-preferred) theme before first paint so there is
         no flash of the wrong palette. Mirrors src/lib/theme.svelte.ts, which
         takes over from mount on (and drives the native status bar). Keep the
         storage key, class names and the light background hex in sync with it.
         The <html> style background is overridden here too, since the inline
         style attribute above would otherwise beat app.css. -->
    <script>
      (function () {
        try {
          var pref = localStorage.getItem('wvvy:theme');
          var mode = pref === 'light' || pref === 'dark' ? pref : window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          var bg = mode === 'light' ? '#ece4d3' : '#0a0908';
          var root = document.documentElement;
          root.classList.toggle('dark', mode === 'dark');
          root.classList.toggle('light', mode === 'light');
          root.style.backgroundColor = bg;
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute('content', bg);
        } catch (e) {
          document.documentElement.classList.add('dark');
        }
      })();
    </script>
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="WVVY" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="description" content="Live community radio from Tisbury, Martha’s Vineyard. WVVY 96.7 LPFM." />
    <!-- Declared by hand rather than left to vite-plugin-pwa: the plugin injects
         this into its own index.html, which SvelteKit replaces with output built
         from this template, so the injection never lands. Without this link the
         app is not installable. -->
    <link rel="manifest" href="%sveltekit.assets%/manifest.json" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Stencil:wght@500;700;900&family=JetBrains+Mono:wght@400;500;700&family=Special+Elite&display=swap" />
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="tap">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
